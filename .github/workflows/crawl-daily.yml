name: Crawl daily killstats

on:
  schedule:
    - cron: '0 14 * * *'  # 14:00 UTC = 11:00 BRT (1h after RubinOT server save)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl-daily
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crawler/package.json

      - name: Install crawler deps
        working-directory: crawler
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: crawler
        run: npx playwright install chromium

      - name: Run crawler
        working-directory: crawler
        run: node crawl.js

      - name: Commit new data
        run: |
          git config user.name "rubinot-kill-stats-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data to commit"
            exit 0
          fi
          git commit -m "data: killstats for $(date -u +%Y-%m-%d)"
          git push
